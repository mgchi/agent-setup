name: Feature request
description: Describe a workflow that needs improvement.
title: "feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to accomplish, and where does the current workflow fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Give a concrete example using fictional projects and synthetic data.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include any existing commands or integrations that address part of the problem.
